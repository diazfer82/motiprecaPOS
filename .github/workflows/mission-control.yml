name: Mission Control diario

on:
  schedule:
    # 7:30 am hora de Cancún (UTC-5) = 12:30 UTC, lunes a sábado
    - cron: "30 12 * * 1-6"
  workflow_dispatch: {}

jobs:
  sync-y-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sincronizar Asana -> Airtable y enviar briefing
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python mission-control/sync.py

      - name: Guardar briefing como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing
          path: mission-control/briefing.html
          if-no-files-found: ignore
