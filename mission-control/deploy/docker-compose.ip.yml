# Docker Compose para acceso por IP (sin dominio, sin HTTPS).
# Uso:  docker compose -f docker-compose.ip.yml up -d --build
# La app queda en http://<IP-del-VPS>
# Cuando tengas el subdominio: usa docker-compose.yml (con Caddy + HTTPS).
services:
  app:
    build: ../app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development   # permite cookies sobre HTTP (sin flag Secure)
      PORT: "80"
      DATA_DIR: /app/data
    ports:
      - "80:80"
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/login"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  app-data:
