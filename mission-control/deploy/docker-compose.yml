# PUNCH! Mission Control — producción en VPS (Hostinger)
# Caddy termina HTTPS (Let's Encrypt automático) y la app solo escucha
# dentro de la red interna de Docker.
services:
  app:
    build: ../app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8443"
      DATA_DIR: /app/data
    volumes:
      - app-data:/app/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8443/login"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on: [app]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  app-data:
  caddy-data:
  caddy-config:

networks:
  internal:
