<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUNCH! Mission Control</title>
<style>
  :root { --bg:#0e0e12; --card:#17171f; --accent:#ff3d57; --text:#f2f2f5; --muted:#9a9aa8;
          --green:#2ecc71; --yellow:#f1c40f; --red:#ff3d57; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:1rem; padding:1rem 1.5rem; border-bottom:1px solid #23232e;
           position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:1.1rem; } header h1 span{color:var(--accent)}
  header .spacer { flex:1; }
  header button, header .pill { background:#23232e; color:var(--text); border:none; border-radius:8px;
           padding:.45rem .9rem; font-size:.85rem; cursor:pointer; }
  main { display:grid; grid-template-columns:1fr 420px; gap:1.25rem; padding:1.25rem 1.5rem; }
  @media (max-width:980px){ main{grid-template-columns:1fr} }
  .stats { display:flex; gap:.8rem; flex-wrap:wrap; margin-bottom:1rem; }
  .stat { background:var(--card); border-radius:12px; padding:.7rem 1.1rem; font-size:.85rem; color:var(--muted); }
  .stat b { display:block; font-size:1.3rem; color:var(--text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(265px,1fr)); gap:.9rem; }
  .cliente { background:var(--card); border-radius:14px; padding:1rem 1.1rem; border-left:4px solid #333; }
  .cliente.red{border-color:var(--red)} .cliente.yellow{border-color:var(--yellow)} .cliente.green{border-color:var(--green)}
  .cliente h3 { font-size:1rem; display:flex; justify-content:space-between; align-items:center; }
  .cliente .ticket { color:var(--muted); font-size:.78rem; margin:.2rem 0 .5rem; }
  .badges { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:.5rem; }
  .badge { font-size:.7rem; background:#23232e; border-radius:6px; padding:.18rem .5rem; color:var(--muted); }
  .badge.alert { background:#3a1620; color:#ff8fa0; }
  .resumen { font-size:.78rem; color:var(--muted); line-height:1.35; max-height:5.4em; overflow:hidden; }
  .cliente a { color:var(--accent); font-size:.75rem; text-decoration:none; }
  /* chat */
  #chat { background:var(--card); border-radius:14px; display:flex; flex-direction:column;
          height:calc(100vh - 130px); position:sticky; top:80px; }
  #chat .head { padding:.9rem 1.1rem; border-bottom:1px solid #23232e; font-weight:700; }
  #chat .head small { color:var(--muted); font-weight:400; display:block; font-size:.75rem; }
  #msgs { flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:.7rem; }
  .msg { max-width:88%; padding:.6rem .85rem; border-radius:12px; font-size:.88rem; line-height:1.45; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
  .msg.bot { align-self:flex-start; background:#22222c; }
  .msg.tool { align-self:flex-start; background:none; color:var(--muted); font-size:.75rem; padding:.1rem .4rem; }
  #chat form { display:flex; gap:.5rem; padding:.8rem; border-top:1px solid #23232e; }
  #chat input { flex:1; padding:.65rem .9rem; border-radius:9px; border:1px solid #2c2c38; background:#0e0e14; color:var(--text); }
  #chat button { background:var(--accent); color:#fff; border:none; border-radius:9px; padding:0 1.1rem; font-weight:700; cursor:pointer; }
  dialog { background:var(--card); color:var(--text); border:1px solid #2c2c38; border-radius:14px; padding:1.5rem; width:min(440px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog input, dialog select { width:100%; margin:.3rem 0 .8rem; padding:.6rem; border-radius:8px; border:1px solid #2c2c38; background:#0e0e14; color:var(--text); }
  dialog button { background:var(--accent); border:none; color:#fff; border-radius:8px; padding:.6rem 1rem; cursor:pointer; }
  dialog .out { font-size:.8rem; color:var(--muted); word-break:break-all; margin-top:.5rem; }
</style>
</head>
<body>
<header>
  <h1>PUNCH!<span> Mission Control</span></h1>
  <span class="pill" id="who"></span>
  <div class="spacer"></div>
  <button id="btnUsers" hidden>Usuarios</button>
  <button id="btn2fa">Activar 2FA</button>
  <button id="btnPass">Contraseña</button>
  <button id="btnOut">Salir</button>
</header>
<main>
  <section>
    <div class="stats" id="stats"></div>
    <div class="grid" id="grid">Cargando clientes…</div>
  </section>
  <aside id="chat">
    <div class="head">PUNCHI 🥊 <small>Tu sparring de datos: pregúntame lo que sea de Punch</small></div>
    <div id="msgs"></div>
    <form id="chatForm">
      <input id="chatInput" placeholder="¿Cómo va GO Outlet hoy?" autocomplete="off">
      <button>➤</button>
    </form>
  </aside>
</main>

<dialog id="dlgUsers">
  <h3>Agregar usuario</h3>
  <input id="nuEmail" type="email" placeholder="correo@punch.com.mx">
  <input id="nuName" placeholder="Nombre">
  <select id="nuRole">
    <option value="member">Member (solo lectura)</option>
    <option value="admin">Admin (puede agregar usuarios)</option>
  </select>
  <button id="nuCreate">Crear</button>
  <button id="nuClose" style="background:#23232e">Cerrar</button>
  <div class="out" id="nuOut"></div>
  <div class="out" id="nuList"></div>
</dialog>

<dialog id="dlgPass">
  <h3>Cambiar contraseña</h3>
  <input id="cpCur" type="password" placeholder="Contraseña actual">
  <input id="cpNew" type="password" placeholder="Nueva (12+ caracteres, Aa1)">
  <button id="cpSave">Guardar</button>
  <button id="cpClose" style="background:#23232e">Cerrar</button>
  <div class="out" id="cpOut"></div>
</dialog>

<dialog id="dlg2fa">
  <h3>Activar 2FA</h3>
  <p style="font-size:.85rem;color:var(--muted)">Agrega esta clave en Google Authenticator / 1Password y confirma con un código.</p>
  <div class="out" id="tfSecret"></div>
  <input id="tfCode" inputmode="numeric" placeholder="Código de 6 dígitos">
  <button id="tfEnable">Confirmar</button>
  <button id="tfClose" style="background:#23232e">Cerrar</button>
  <div class="out" id="tfOut"></div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
